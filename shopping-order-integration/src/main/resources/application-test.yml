server:
  port: 8080

spring:
  application:
    name: shopping-order-integration

  datasource:
    url: jdbc:postgresql://localhost:5432/customer
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

camel:
  springboot:
    name: shopping-camel-context